name: test

on:
  workflow_dispatch:
  pull_request:


jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Python tests
        run: python3 -m unittest discover -s scripts/tests -v

  dotfiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dotfiles
        run: ./install.sh

  test-site:
    permissions:
      contents: read
    uses: athackst/ci/.github/workflows/mkdocs_site.yml@main

  complete:
    if: ${{ always() }}
    needs:
      - python-tests
      - dotfiles
      - test-site
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS_RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::All required jobs must succeed. A job failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All required jobs passed!"
