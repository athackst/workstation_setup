name: test

on:
  workflow_dispatch:
  pull_request:


jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Python tests
        run: python3 -m unittest discover -s scripts/tests -v

  dotfiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dotfiles
        run: ./install.sh

  test-site:
    permissions:
      contents: read
    uses: athackst/ci/.github/workflows/mkdocs_site.yml@main

  complete:
    needs:
      - python-tests
      - dotfiles
      - test-site
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: echo "Completed successfully!"
